<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
<title id="title">Addition number line showing two plus three equals five</title>
<desc id="desc">A number line from zero to six. It starts at two and shows three forward jumps, landing on five.</desc>
<rect width="760" height="260" fill="white"/>
<line x1="80" y1="165" x2="680" y2="165" stroke="#222" stroke-width="4"/>
<path d="M680 165 l-14 -9 v18 z" fill="#222"/>
<g stroke="#222" stroke-width="3" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#222">
<line x1="100" y1="150" x2="100" y2="180"/><text x="100" y="210" stroke="none">0</text>
<line x1="190" y1="150" x2="190" y2="180"/><text x="190" y="210" stroke="none">1</text>
<line x1="280" y1="150" x2="280" y2="180"/><text x="280" y="210" stroke="none">2</text>
<line x1="370" y1="150" x2="370" y2="180"/><text x="370" y="210" stroke="none">3</text>
<line x1="460" y1="150" x2="460" y2="180"/><text x="460" y="210" stroke="none">4</text>
<line x1="550" y1="150" x2="550" y2="180"/><text x="550" y="210" stroke="none">5</text>
<line x1="640" y1="150" x2="640" y2="180"/><text x="640" y="210" stroke="none">6</text>
</g>
<g fill="none" stroke="#333" stroke-width="4">
<path d="M280 140 Q325 55 370 140"/>
<path d="M370 140 Q415 55 460 140"/>
<path d="M460 140 Q505 55 550 140"/>
</g>
<g fill="#333">
<path d="M370 140 l-13 -6 5 14 z"/><path d="M460 140 l-13 -6 5 14 z"/><path d="M550 140 l-13 -6 5 14 z"/>
</g>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#222">
<text x="415" y="35" font-size="28">2 + 3 = 5</text>
<text x="325" y="78" font-size="18">+1</text><text x="415" y="78" font-size="18">+1</text><text x="505" y="78" font-size="18">+1</text>
</g>
</svg>
